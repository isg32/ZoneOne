<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">ZoneOne Music Player — System Overview</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#555555">breakout board connects everything through J1/J2/J3/J4 — see BREAKOUT_BOARD.md for exact pin tables</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- ESP32-S3 module (center) -->
  <rect x="360" y="270" width="240" height="100" rx="8" fill="#fff4e0" stroke="#c9860f" stroke-width="2"/>
  <text x="480" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#7a5300">ESP32-S3-WROOM-1</text>
  <text x="480" y="326" text-anchor="middle" font-size="12" fill="#7a5300">N16R8 dev board</text>
  <text x="480" y="344" text-anchor="middle" font-size="11" fill="#9a7420">plugs into breakout socket J1</text>
  <text x="480" y="360" text-anchor="middle" font-size="10" fill="#9a7420">(OPI PSRAM required)</text>

  <!-- Onboard SD (top-left, fixed pins, not on breakout header) -->
  <rect x="60" y="60" width="220" height="90" rx="8" fill="#eef2ff" stroke="#3949ab" stroke-width="2"/>
  <text x="170" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">Onboard microSD slot</text>
  <text x="170" y="112" text-anchor="middle" font-size="11" fill="#283593">built into the dev board</text>
  <text x="170" y="128" text-anchor="middle" font-size="10" fill="#283593">not a breakout connector — fixed pins</text>

  <line x1="280" y1="120" x2="360" y2="290" stroke="#3949ab" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="200" font-size="10.5" fill="#283593">SPI (fixed):</text>
  <text x="255" y="213" font-size="10.5" fill="#283593">CS 10 · SCK 12</text>
  <text x="255" y="226" font-size="10.5" fill="#283593">MOSI 11 · MISO 13</text>

  <!-- Display (top-right) -->
  <rect x="660" y="50" width="240" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="780" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">2.4" ST7789V TFT</text>
  <text x="780" y="104" text-anchor="middle" font-size="11" fill="#1b5e20">240×320, 10-pin</text>
  <text x="780" y="122" text-anchor="middle" font-size="10" fill="#2e7d32">connector J2</text>

  <line x1="600" y1="300" x2="700" y2="150" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="220" font-size="10.5" fill="#1b5e20">SPI: SCK 18 · MOSI 38</text>
  <text x="618" y="233" font-size="10.5" fill="#1b5e20">CS 9 · DC 48 · RST 3</text>
  <text x="618" y="246" font-size="10.5" fill="#1b5e20">BL 47 · VDD 3V3</text>

  <!-- DAC (right, mid) -->
  <rect x="660" y="270" width="240" height="100" rx="8" fill="#fde7e9" stroke="#c62828" stroke-width="2"/>
  <text x="780" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#8e0000">CJMCU-1334</text>
  <text x="780" y="322" text-anchor="middle" font-size="11" fill="#8e0000">UDA1334A I2S DAC</text>
  <text x="780" y="340" text-anchor="middle" font-size="10" fill="#c62828">connector J3</text>
  <text x="780" y="356" text-anchor="middle" font-size="9.5" fill="#c62828">SF0/SF1/MUTE/PLL/DEEM hardwired to GND on PCB</text>

  <line x1="600" y1="320" x2="660" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="300" font-size="10.5" fill="#8e0000">I2S: BCLK 15</text>
  <text x="605" y="386" font-size="10.5" fill="#8e0000">WSEL 16 · DIN 17 · VIN 5V</text>

  <!-- Buttons (bottom-right) -->
  <rect x="660" y="480" width="240" height="100" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="780" y="514" text-anchor="middle" font-size="14" font-weight="700" fill="#4a0072">5× Momentary Buttons</text>
  <text x="780" y="532" text-anchor="middle" font-size="11" fill="#4a0072">PLAY · NEXT · PREV · UP · DOWN</text>
  <text x="780" y="550" text-anchor="middle" font-size="10" fill="#6a1b9a">connector J4</text>

  <line x1="600" y1="345" x2="700" y2="480" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="420" font-size="10.5" fill="#4a0072">GPIO 4-8</text>
  <text x="612" y="433" font-size="10.5" fill="#4a0072">(INPUT_PULLUP)</text>
  <text x="612" y="446" font-size="10.5" fill="#4a0072">other leg → GND</text>

  <!-- footer legend -->
  <rect x="60" y="600" width="14" height="14" fill="#fff4e0" stroke="#c9860f"/>
  <text x="80" y="611" font-size="10.5" fill="#333333">ESP32-S3 module (J1)</text>
  <rect x="220" y="600" width="14" height="14" fill="#eef2ff" stroke="#3949ab"/>
  <text x="240" y="611" font-size="10.5" fill="#333333">onboard, fixed pins</text>
  <rect x="380" y="600" width="14" height="14" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="400" y="611" font-size="10.5" fill="#333333">display</text>
  <rect x="480" y="600" width="14" height="14" fill="#fde7e9" stroke="#c62828"/>
  <text x="500" y="611" font-size="10.5" fill="#333333">DAC</text>
  <rect x="560" y="600" width="14" height="14" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="580" y="611" font-size="10.5" fill="#333333">buttons</text>
</svg>
