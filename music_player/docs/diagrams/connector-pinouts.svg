<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="680" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">Connector Pinouts — J2 / J3 / J4</text>
  <text x="520" y="48" text-anchor="middle" font-size="11" fill="#555555">pin 1 at top of each header, matching each module's own silkscreen order</text>

  <!-- ================= J2 Display (10 pins) ================= -->
  <text x="150" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">J2 — Display (10-pin)</text>
  <g font-size="11">
    <!-- pin rows: y start 100, step 32 -->
    <!-- template repeated -->
    <!-- pin1 GND -->
    <rect x="40" y="100" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="118" text-anchor="middle" fill="#1b5e20" font-weight="700">1</text>
    <text x="84" y="118" fill="#1b5e20">GND</text><text x="200" y="118" fill="#555555">GND</text>
    <!-- pin2 RS -->
    <rect x="40" y="132" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="150" text-anchor="middle" fill="#1b5e20" font-weight="700">2</text>
    <text x="84" y="150" fill="#1b5e20">RS</text><text x="200" y="150" fill="#555555">GPIO 48</text>
    <!-- pin3 CS -->
    <rect x="40" y="164" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="182" text-anchor="middle" fill="#1b5e20" font-weight="700">3</text>
    <text x="84" y="182" fill="#1b5e20">CS</text><text x="200" y="182" fill="#555555">GPIO 9</text>
    <!-- pin4 SCL -->
    <rect x="40" y="196" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="214" text-anchor="middle" fill="#1b5e20" font-weight="700">4</text>
    <text x="84" y="214" fill="#1b5e20">SCL</text><text x="200" y="214" fill="#555555">GPIO 18</text>
    <!-- pin5 SDA -->
    <rect x="40" y="228" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="246" text-anchor="middle" fill="#1b5e20" font-weight="700">5</text>
    <text x="84" y="246" fill="#1b5e20">SDA</text><text x="200" y="246" fill="#555555">GPIO 38</text>
    <!-- pin6 RESET -->
    <rect x="40" y="260" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="278" text-anchor="middle" fill="#1b5e20" font-weight="700">6</text>
    <text x="84" y="278" fill="#1b5e20">RESET</text><text x="200" y="278" fill="#555555">GPIO 3</text>
    <!-- pin7 VDD -->
    <rect x="40" y="292" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="310" text-anchor="middle" fill="#1b5e20" font-weight="700">7</text>
    <text x="84" y="310" fill="#1b5e20">VDD</text><text x="200" y="310" fill="#555555">3V3</text>
    <!-- pin8 GND -->
    <rect x="40" y="324" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="342" text-anchor="middle" fill="#1b5e20" font-weight="700">8</text>
    <text x="84" y="342" fill="#1b5e20">GND</text><text x="200" y="342" fill="#555555">GND</text>
    <!-- pin9 LED+ -->
    <rect x="40" y="356" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="374" text-anchor="middle" fill="#1b5e20" font-weight="700">9</text>
    <text x="84" y="374" fill="#1b5e20">LED+</text><text x="200" y="374" fill="#555555">GPIO 47</text>
    <!-- pin10 LED- -->
    <rect x="40" y="388" width="34" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="57" y="406" text-anchor="middle" fill="#1b5e20" font-weight="700">10</text>
    <text x="84" y="406" fill="#1b5e20">LED-</text><text x="200" y="406" fill="#555555">GND</text>
  </g>

  <!-- ================= J3 DAC (15 pins) ================= -->
  <text x="480" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#8e0000">J3 — DAC (15-pin)</text>
  <g font-size="11">
    <rect x="360" y="100" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="118" text-anchor="middle" fill="#8e0000" font-weight="700">1</text>
    <text x="404" y="118" fill="#8e0000">VIN</text><text x="510" y="118" fill="#555555">5V</text>
    <rect x="360" y="132" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="150" text-anchor="middle" fill="#8e0000" font-weight="700">2</text>
    <text x="404" y="150" fill="#8e0000">3V0</text><text x="510" y="150" fill="#555555">NC — DAC's own output</text>
    <rect x="360" y="164" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="182" text-anchor="middle" fill="#8e0000" font-weight="700">3</text>
    <text x="404" y="182" fill="#8e0000">GND</text><text x="510" y="182" fill="#555555">GND</text>
    <rect x="360" y="196" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="214" text-anchor="middle" fill="#8e0000" font-weight="700">4</text>
    <text x="404" y="214" fill="#8e0000">WSEL</text><text x="510" y="214" fill="#555555">GPIO 16</text>
    <rect x="360" y="228" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="246" text-anchor="middle" fill="#8e0000" font-weight="700">5</text>
    <text x="404" y="246" fill="#8e0000">DIN</text><text x="510" y="246" fill="#555555">GPIO 17</text>
    <rect x="360" y="260" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="278" text-anchor="middle" fill="#8e0000" font-weight="700">6</text>
    <text x="404" y="278" fill="#8e0000">BCLK</text><text x="510" y="278" fill="#555555">GPIO 15</text>
    <rect x="360" y="292" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="310" text-anchor="middle" fill="#8e0000" font-weight="700">7</text>
    <text x="404" y="310" fill="#8e0000">LOUT</text><text x="510" y="310" fill="#555555">3.5mm jack, left</text>
    <rect x="360" y="324" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="342" text-anchor="middle" fill="#8e0000" font-weight="700">8</text>
    <text x="404" y="342" fill="#8e0000">AGND</text><text x="510" y="342" fill="#555555">GND</text>
    <rect x="360" y="356" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="374" text-anchor="middle" fill="#8e0000" font-weight="700">9</text>
    <text x="404" y="374" fill="#8e0000">ROUT</text><text x="510" y="374" fill="#555555">3.5mm jack, right</text>
    <rect x="360" y="388" width="34" height="26" fill="#fde7e9" stroke="#c62828"/><text x="377" y="406" text-anchor="middle" fill="#8e0000" font-weight="700">10</text>
    <text x="404" y="406" fill="#8e0000">SCK</text><text x="510" y="406" fill="#555555">NC — derives clock from BCLK</text>
    <rect x="360" y="420" width="34" height="26" fill="#ffd9db" stroke="#c62828"/><text x="377" y="438" text-anchor="middle" fill="#8e0000" font-weight="700">11</text>
    <text x="404" y="438" fill="#8e0000">SF1</text><text x="510" y="438" fill="#8e0000" font-weight="700">GND — hardwired on PCB</text>
    <rect x="360" y="452" width="34" height="26" fill="#ffd9db" stroke="#c62828"/><text x="377" y="470" text-anchor="middle" fill="#8e0000" font-weight="700">12</text>
    <text x="404" y="470" fill="#8e0000">MUTE</text><text x="510" y="470" fill="#8e0000" font-weight="700">GND — hardwired on PCB (active HIGH)</text>
    <rect x="360" y="484" width="34" height="26" fill="#ffd9db" stroke="#c62828"/><text x="377" y="502" text-anchor="middle" fill="#8e0000" font-weight="700">13</text>
    <text x="404" y="502" fill="#8e0000">SF0</text><text x="510" y="502" fill="#8e0000" font-weight="700">GND — hardwired on PCB</text>
    <rect x="360" y="516" width="34" height="26" fill="#ffd9db" stroke="#c62828"/><text x="377" y="534" text-anchor="middle" fill="#8e0000" font-weight="700">14</text>
    <text x="404" y="534" fill="#8e0000">PLL</text><text x="510" y="534" fill="#8e0000" font-weight="700">GND — hardwired on PCB</text>
    <rect x="360" y="548" width="34" height="26" fill="#ffd9db" stroke="#c62828"/><text x="377" y="566" text-anchor="middle" fill="#8e0000" font-weight="700">15</text>
    <text x="404" y="566" fill="#8e0000">DEEM</text><text x="510" y="566" fill="#8e0000" font-weight="700">GND — hardwired on PCB</text>
  </g>
  <text x="480" y="600" text-anchor="middle" font-size="10" fill="#8e0000">pins 11-15 (darker) are tied straight to the GND plane on the breakout — not exposed as header pins</text>

  <!-- ================= J4 Buttons (6 pins) ================= -->
  <text x="900" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#4a0072">J4 — Buttons (6-pin)</text>
  <g font-size="11">
    <rect x="800" y="100" width="34" height="26" fill="#f3e5f5" stroke="#6a1b9a"/><text x="817" y="118" text-anchor="middle" fill="#4a0072" font-weight="700">1</text>
    <text x="844" y="118" fill="#4a0072">PLAY</text><text x="920" y="118" fill="#555555">GPIO 4</text>
    <rect x="800" y="132" width="34" height="26" fill="#f3e5f5" stroke="#6a1b9a"/><text x="817" y="150" text-anchor="middle" fill="#4a0072" font-weight="700">2</text>
    <text x="844" y="150" fill="#4a0072">NEXT</text><text x="920" y="150" fill="#555555">GPIO 5</text>
    <rect x="800" y="164" width="34" height="26" fill="#f3e5f5" stroke="#6a1b9a"/><text x="817" y="182" text-anchor="middle" fill="#4a0072" font-weight="700">3</text>
    <text x="844" y="182" fill="#4a0072">PREV</text><text x="920" y="182" fill="#555555">GPIO 6</text>
    <rect x="800" y="196" width="34" height="26" fill="#f3e5f5" stroke="#6a1b9a"/><text x="817" y="214" text-anchor="middle" fill="#4a0072" font-weight="700">4</text>
    <text x="844" y="214" fill="#4a0072">UP</text><text x="920" y="214" fill="#555555">GPIO 7</text>
    <rect x="800" y="228" width="34" height="26" fill="#f3e5f5" stroke="#6a1b9a"/><text x="817" y="246" text-anchor="middle" fill="#4a0072" font-weight="700">5</text>
    <text x="844" y="246" fill="#4a0072">DOWN</text><text x="920" y="246" fill="#555555">GPIO 8</text>
    <rect x="800" y="260" width="34" height="26" fill="#f3e5f5" stroke="#6a1b9a"/><text x="817" y="278" text-anchor="middle" fill="#4a0072" font-weight="700">6</text>
    <text x="844" y="278" fill="#4a0072">GND</text><text x="920" y="278" fill="#555555">shared return</text>
  </g>
  <text x="900" y="310" text-anchor="middle" font-size="10" fill="#4a0072">each button: signal pin ↔ GND pin</text>
  <text x="900" y="324" text-anchor="middle" font-size="10" fill="#4a0072">(internal pull-ups enabled in firmware,</text>
  <text x="900" y="338" text-anchor="middle" font-size="10" fill="#4a0072">no external resistors needed)</text>
</svg>
